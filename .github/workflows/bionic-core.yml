name: bionic core

on:
  push:
    branches: [source-first-layout]
  pull_request:
    branches: [source-first-layout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-bionic-wide:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [armv7a, aarch64]
    name: android-bionic-wide (${{ matrix.abi }})
    env:
      EXPECTED_NDK_REVISION: 27.3.13750724
      NDK_ARCHIVE_SHA1: 22105e410cf29afcf163760cc95522b9fb981121
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Verify Ubuntu execution environment
        shell: bash
        run: |
          set -eu
          . /etc/os-release
          test "$ID" = ubuntu
          test "$(uname -m)" = x86_64

      - name: Install build prerequisites
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git ncurses-bin python3 unzip

      - name: Install pinned Android NDK r27d
        shell: bash
        run: |
          set -eux
          archive="$RUNNER_TEMP/android-ndk-r27d-linux.zip"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip \
            --output "$archive"
          printf '%s  %s\n' "$NDK_ARCHIVE_SHA1" "$archive" | sha1sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          rm "$archive"
          grep -F 'Pkg.Revision = 27.3.13750724' "$RUNNER_TEMP/android-ndk-r27d/source.properties"
          printf 'ANDROID_NDK_HOME=%s/android-ndk-r27d\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Cross-build and link the pruned-core PTY bundle
        shell: bash
        run: bash .github/build_bionic_smoke.sh '${{ matrix.abi }}'

      - name: Retain bundle and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bionic-api24-${{ matrix.abi }}-${{ github.run_id }}
          path: |
            _/bionic-validation/${{ matrix.abi }}/bundle/
            _/bionic-validation/${{ matrix.abi }}/*.txt
            _/bionic-validation/${{ matrix.abi }}/*.log
            _/bionic-validation/${{ matrix.abi }}/link.map
            _/bionic-validation/${{ matrix.abi }}/build/config.log
          if-no-files-found: warn

      - name: Record acceptance boundary
        run: |
          printf '%s\n' \
            'build host: GitHub-hosted Ubuntu 24.04 x86-64' \
            'evidence: Bionic configure/build, PTY executable link, ELF checks, checksummed bundle' \
            'Android runtime: NOT RUN by this job' \
            'physical-device acceptance: NOT ESTABLISHED'
