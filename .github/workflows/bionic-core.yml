name: bionic core

on:
  push:
    branches: [source-first-layout]
  pull_request:
    branches: [source-first-layout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-bionic-wide:
    # Never execute a fork's proposed code on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, debian]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        abi: [armv7a, aarch64]
    name: android-bionic-wide (${{ matrix.abi }})
    env:
      EXPECTED_NDK_REVISION: 27.3.13750724
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Verify Debian execution environment
        shell: bash
        run: |
          set -eu
          . /etc/os-release
          test "$ID" = debian
          for program in cc make awk git tic python3 sha256sum; do
            command -v "$program"
          done
          # Runner provisioning must supply this exact NDK; do not substitute
          # an Ubuntu runner or silently download a different toolchain.
          test -n "${ANDROID_NDK_HOME:-}"
          test -f "$ANDROID_NDK_HOME/source.properties"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Cross-build and link the pruned-core PTY bundle
        shell: bash
        run: bash .github/build_bionic_smoke.sh '${{ matrix.abi }}'

      - name: Retain bundle and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bionic-api24-${{ matrix.abi }}-${{ github.run_id }}
          path: |
            _/bionic-validation/${{ matrix.abi }}/bundle/
            _/bionic-validation/${{ matrix.abi }}/*.txt
            _/bionic-validation/${{ matrix.abi }}/*.log
            _/bionic-validation/${{ matrix.abi }}/link.map
            _/bionic-validation/${{ matrix.abi }}/build/config.log
          if-no-files-found: warn

      - name: Record acceptance boundary
        run: |
          printf '%s\n' \
            'evidence: Bionic configure/build, PTY executable link, ELF checks, checksummed bundle' \
            'Android runtime: NOT RUN by this job' \
            'physical-device acceptance: NOT ESTABLISHED'

  # Artifact-production fallback while the accepted self-hosted Debian runners
  # are unavailable.  This does not replace the job above as Debian runner
  # acceptance: only the build userspace is Debian; the GitHub host is Ubuntu.
  github-hosted-debian-package:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 35
    env:
      EXPECTED_NDK_REVISION: 27.3.13750724
      NDK_ARCHIVE_SHA1: 22105e410cf29afcf163760cc95522b9fb981121
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Install Debian build prerequisites
        shell: bash
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git ncurses-bin python3 unzip
          rm -rf /var/lib/apt/lists/*
          . /etc/os-release
          test "$ID" = debian

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Android NDK r27d
        shell: bash
        run: |
          set -eux
          archive=/tmp/android-ndk-r27d-linux.zip
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip \
            --output "$archive"
          printf '%s  %s\n' "$NDK_ARCHIVE_SHA1" "$archive" | sha1sum -c -
          unzip -q "$archive" -d /opt
          rm "$archive"
          grep -F 'Pkg.Revision = 27.3.13750724' /opt/android-ndk-r27d/source.properties
          printf 'ANDROID_NDK_HOME=/opt/android-ndk-r27d\n' >> "$GITHUB_ENV"

      - name: Build both checksummed Android bundles
        shell: bash
        run: |
          set +e
          status=0
          bash .github/build_bionic_smoke.sh armv7a || status=1
          bash .github/build_bionic_smoke.sh aarch64 || status=1
          exit "$status"

      - name: Retain phone/tablet bundles and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bionic-api24-device-bundles-${{ github.run_id }}
          path: |
            _/bionic-validation/armv7a/bundle/
            _/bionic-validation/armv7a/*.txt
            _/bionic-validation/armv7a/*.log
            _/bionic-validation/armv7a/link.map
            _/bionic-validation/armv7a/build/config.log
            _/bionic-validation/aarch64/bundle/
            _/bionic-validation/aarch64/*.txt
            _/bionic-validation/aarch64/*.log
            _/bionic-validation/aarch64/link.map
            _/bionic-validation/aarch64/build/config.log
          if-no-files-found: warn

      - name: Record fallback boundary
        if: always()
        run: |
          printf '%s\n' \
            'purpose: produce a pinned-NDK Bionic bundle for Android runtime testing' \
            'build userspace: Debian bookworm container on GitHub-hosted Ubuntu' \
            'self-hosted Debian acceptance: NOT ESTABLISHED by this fallback job' \
            'Android runtime: NOT RUN by this job' \
            'physical-device acceptance: NOT ESTABLISHED'
