name: Android emulator runtime

on:
  push:
    branches: [source-first-layout]
  pull_request:
    branches: [source-first-layout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86_64-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_NDK_REVISION: 27.3.13750724
      NDK_ARCHIVE_SHA1: 22105e410cf29afcf163760cc95522b9fb981121
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SYSTEM_IMAGE: system-images;android-34;default;x86_64
    steps:
      - name: Verify Ubuntu execution environment
        shell: bash
        run: |
          set -eu
          . /etc/os-release
          test "$ID" = ubuntu
          test "$(uname -m)" = x86_64
          command -v sdkmanager
          command -v avdmanager
          command -v adb

      - name: Install build prerequisites
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git ncurses-bin python3 unzip

      - name: Install pinned Android NDK r27d
        shell: bash
        run: |
          set -eux
          archive="$RUNNER_TEMP/android-ndk-r27d-linux.zip"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip \
            --output "$archive"
          printf '%s  %s\n' "$NDK_ARCHIVE_SHA1" "$archive" | sha1sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          rm "$archive"
          grep -F 'Pkg.Revision = 27.3.13750724' "$RUNNER_TEMP/android-ndk-r27d/source.properties"
          printf 'ANDROID_NDK_HOME=%s/android-ndk-r27d\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build x86_64 Bionic runtime bundle
        shell: bash
        run: bash .github/build_bionic_smoke.sh x86_64

      - name: Install Android emulator image
        shell: bash
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' "$SYSTEM_IMAGE"
          command -v emulator
          echo no | avdmanager create avd --force \
            --name ncurses-runtime \
            --package "$SYSTEM_IMAGE" \
            --device pixel_2
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Boot Android emulator
        shell: bash
        run: |
          set -eux
          nohup emulator \
            -avd ncurses-runtime \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -no-metrics \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 180 bash -c '
            until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do
              sleep 2
            done
          '
          test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          adb shell getprop ro.build.fingerprint
          adb shell getprop ro.product.cpu.abilist

      - name: Execute exact bundle and retain runtime receipt
        shell: bash
        run: |
          set -euo pipefail
          remote=/data/local/tmp/ncurses-runtime
          adb shell "rm -rf '$remote' && mkdir -p '$remote'"
          adb push _/bionic-validation/x86_64/bundle/. "$remote/"
          adb shell "chmod 700 '$remote/modern_core_smoke' '$remote/run.sh'"
          adb shell "cd '$remote' && sh ./run.sh emulator" | tee emulator-run.txt
          receipt_dir=$(sed -n 's/^receipt_directory=//p' emulator-run.txt | tr -d '\r' | tail -n 1)
          test -n "$receipt_dir"
          mkdir emulator-receipt
          adb pull "$receipt_dir/." emulator-receipt/
          grep -qx 'android_pty_runtime=pass' emulator-receipt/runtime-receipt.txt
          grep -qx 'context_operator_declared=emulator' emulator-receipt/context.txt
          grep -qx 'ro.kernel.qemu=1' emulator-receipt/context.txt

      - name: Retain emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ncurses-android-emulator-${{ github.run_id }}
          path: |
            emulator-run.txt
            emulator-receipt/
            _/bionic-validation/x86_64/bundle/build-receipt.txt
            _/bionic-validation/x86_64/bundle/executable-elf.txt
            _/bionic-validation/x86_64/bundle/SHA256SUMS
            ${{ runner.temp }}/emulator.log
          if-no-files-found: warn

      - name: Record acceptance boundary
        if: always()
        shell: bash
        run: |
          printf '%s\n' \
            'host: GitHub-hosted Ubuntu 24.04 x86-64' \
            'runtime: Android emulator / Bionic x86_64' \
            'scope: private PTY runtime harness' \
            'physical-device acceptance: NOT ESTABLISHED' \
            'interactive terminal acceptance: NOT ESTABLISHED'
