name: modern core

on:
  push:
    branches: [source-first-layout]
  pull_request:
    branches: [source-first-layout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-glibc-wide:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, debian]
    timeout-minutes: 20
    steps:
      - name: Verify Debian execution environment
        shell: bash
        run: |
          set -eu
          . /etc/os-release
          test "$ID" = debian
          for program in cc make awk git tic; do command -v "$program"; done

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure modern core
        working-directory: _
        run: |
          ./configure \
            --without-ada \
            --without-cxx \
            --without-cxx-binding \
            --without-debug \
            --without-manpages \
            --without-tests \
            --enable-widec

      - name: Build modern core
        working-directory: _
        run: make -j2

      - name: Build existing modern-core pty smoke test
        working-directory: _
        run: |
          cc -D_DEFAULT_SOURCE -D_XOPEN_SOURCE=600 -Iinclude \
            ../.github/modern_core_smoke.c lib/libncursesw.a -lutil \
            -o modern_core_smoke

      - name: Exercise existing output input wide characters and resize
        working-directory: _
        env:
          LC_ALL: C.UTF-8
          TERM: xterm-256color
        run: ./modern_core_smoke

      - name: Build portable PTY harness and controlled terminfo fixture
        working-directory: _
        run: |
          cc -D_DEFAULT_SOURCE -Iinclude \
            ../.github/bionic_runtime_smoke.c lib/libncursesw.a -lutil \
            -o bionic_runtime_smoke_host
          mkdir -p host-smoke-terminfo
          tic -o host-smoke-terminfo ../.github/modern_core_smoke.ti

      - name: Check the new harness on glibc without claiming Bionic execution
        working-directory: _
        shell: bash
        env:
          LC_ALL: C.UTF-8
          TERM: ncurses-pruned-smoke
          NCURSES_SMOKE_TERM: ncurses-pruned-smoke
        run: |
          set -euo pipefail
          export TERMINFO="$PWD/host-smoke-terminfo" TERMINFO_DIRS="$PWD/host-smoke-terminfo"
          ./bionic_runtime_smoke_host | tee host-smoke-receipt.txt
          grep -qx 'runtime_libc=glibc' host-smoke-receipt.txt
          grep -qx 'modern_core_pty=pass' host-smoke-receipt.txt

      - name: Retain host diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-core-glibc-${{ github.run_id }}
          path: |
            _/config.log
            _/host-smoke-receipt.txt
          if-no-files-found: warn

      - name: Record scope
        run: |
          printf '%s\n' \
            'execution environment: Debian/glibc' \
            'exercised: existing smoke plus controlled PTY UTF-8 input/output, bounded timeout, tty restoration' \
            'this is not Android/Bionic execution or physical-device acceptance'
